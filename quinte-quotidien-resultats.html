function rxa(q){return String(q).split("").map(function(c){var b=nr(c),s=EQA[b];return s?"["+s+"]":c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("");}
function ds(q){
  var ql=nr(q),cb=document.getElementById("cb"),mc=document.getElementById("mc");
  cb.classList.toggle("on",q.length>0);
  if(!ql){mc.textContent="";document.querySelectorAll(".sh.on tbody tr").forEach(function(r){r.classList.remove("hd");rm(r);});return;}
  var n=0;
  document.querySelectorAll(".sh.on tbody tr").forEach(function(row){
    if(nr(row.textContent).indexOf(ql)>=0){row.classList.remove("hd");hl(row,ql);n++;}
    else{row.classList.add("hd");rm(row);}
  });
  mc.textContent=n+(n===1?" r\u00e9sultat":" r\u00e9sultats");
}
function cs(){
  var i=document.getElementById("sq");i.value="";
  document.getElementById("cb").classList.remove("on");
  document.getElementById("mc").textContent="";
  document.querySelectorAll("tbody tr").forEach(function(r){r.classList.remove("hd");rm(r);});
}
function hl(r,q){
  r.querySelectorAll("td").forEach(function(td){
    var o=td.getAttribute("data-o")||td.textContent;
    td.setAttribute("data-o",o);
    var re=new RegExp("("+rxa(q)+")","gi");
    td.innerHTML=o.replace(re,"<mark>$1<\/mark>");
  });
}
function rm(r){
  r.querySelectorAll("td").forEach(function(td){
    var o=td.getAttribute("data-o");
    if(o){td.textContent=o;td.removeAttribute("data-o");}
  });
}
function addTopScrollbars(){
  document.querySelectorAll(".ts").forEach(function(ts){
    var tbl=ts.querySelector("table.wt");
    if(!tbl)return;
    var top=document.createElement("div");
    top.className="ts-top";
    top.innerHTML="<div style='height:1px'></div>";
    ts.parentNode.insertBefore(top,ts);
    top.firstChild.style.width=tbl.offsetWidth+"px";
    top.addEventListener("scroll",function(){ts.scrollLeft=top.scrollLeft;});
    ts.addEventListener("scroll",function(){top.scrollLeft=ts.scrollLeft;});
  });
}
// Valeur numerique d'une cellule, figee a la generation dans data-v.
// Le texte affiche ne peut pas servir : "60 flamme +5" donnerait 605,
// et un score SergeLive avec bonus donnerait un nombre a 11 chiffres.
function vnum(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  var s=String(v==null?"":v);
  var m=s.match(/<strong>\s*(-?\d+(?:[.,]\d+)?)\s*<\/strong>/);
  if(m) return m[1].replace(",",".");
  s=s.trim();
  return /^-?\d+(?:[.,]\d+)?$/.test(s)?s.replace(",","."):null;
}
function cnum(td){
  if(!td) return undefined;
  var d=td.getAttribute("data-v");
  if(d===null||d==="") return undefined;
  var n=parseFloat(d);
  return isNaN(n)?undefined:n;
}
function cvide(td){
  var t=td?(td.textContent||"").trim():"";
  return t===""||t==="-"||t==="\u2013"||t==="\u2014";
}
function initSort(){
  document.querySelectorAll(".sh table").forEach(function(tbl){
    tbl.querySelectorAll("thead th").forEach(function(th,ci){
      if(/joker|attendus/i.test(th.textContent)) return;
      th.classList.add("sk");
      var sp=document.createElement("span");
      sp.className="sa";sp.textContent="\u21c5";
      th.appendChild(sp);
      th.addEventListener("click",function(){
        var asc=th.dataset.sort!=="asc";
        tbl.querySelectorAll("thead th").forEach(function(h){
          h.dataset.sort="";
          var s=h.querySelector(".sa");
          if(s){s.textContent="\u21c5";s.style.opacity=".55";}
        });
        th.dataset.sort=asc?"asc":"desc";
        sp.textContent=asc?"\u2191":"\u2193";
        sp.style.opacity="1";
        var tbody=tbl.querySelector("tbody");
        var rows=Array.from(tbody.querySelectorAll("tr"));
        // Colonne numerique = aucune cellule non vide sans data-v.
        // Un seul pseudo comme "205" la fait basculer en tri texte.
        var nNum=0,nTxt=0;
        rows.forEach(function(r){
          var td=r.cells[ci];
          if(cnum(td)!==undefined) nNum++;
          else if(!cvide(td)) nTxt++;
        });
        var num=nNum>0&&nTxt===0;
        rows.sort(function(a,b){
          var ta=a.cells[ci],tb=b.cells[ci];
          if(num){
            var na=cnum(ta),nb=cnum(tb);
            // Les cellules vides restent en fin dans les deux sens.
            if(na===undefined) return nb===undefined?0:1;
            if(nb===undefined) return -1;
            return asc?na-nb:nb-na;
          }
          var av=(ta?ta.textContent:"").trim(),bv=(tb?tb.textContent:"").trim();
          return asc?av.localeCompare(bv,"fr"):bv.localeCompare(av,"fr");
        });
        rows.forEach(function(r){tbody.appendChild(r);});
      });
    });
  });
}
</script>
