<style>
:root{--g:#1a6b3c;--gl:#e8f5ee;--gm:#2d8a52;--b:#dde8e3;--bg:#f7faf8;--mu:#666;--tx:#1a1a1a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
header{background:var(--g);color:#fff;padding:24px 20px 20px;text-align:center;}
header h1{font-family:"Playfair Display",serif;font-size:clamp(22px,5vw,36px);}
header p{font-size:13px;opacity:.75;margin-top:4px;}
.tw{background:#fff;border-bottom:1px solid var(--b);overflow-x:auto;scrollbar-width:none;}
.tw::-webkit-scrollbar{display:none;}
.tbs{display:flex;min-width:max-content;padding:0 12px;}
.tb{padding:12px 16px;font-size:13px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tb.on{color:var(--g);border-bottom-color:var(--g);font-weight:600;}
.sb{background:#fff;padding:10px 16px;border-bottom:1px solid var(--b);}.sb-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:8px;}
.sb input{flex:1;border:2px solid var(--g);border-radius:8px;padding:10px 16px;font-size:15px;outline:none;background:#fff;box-shadow:0 2px 8px rgba(26,107,60,.18);transition:border-color .15s,box-shadow .15s;}
.sb input:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(26,107,60,.2);}.sb input::placeholder{color:#999;}
.clr{background:none;border:none;cursor:pointer;color:var(--mu);font-size:18px;padding:2px 6px;display:none;}.clr.on{display:block;}
.mc{font-size:12px;color:var(--mu);white-space:nowrap;min-width:60px;text-align:right;}
.ct{padding:16px;max-width:960px;margin:0 auto;}
.sh{display:none;}.sh.on{display:block;}
.ts{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 200px);margin-top:8px;}.ts::-webkit-scrollbar{height:8px;width:8px;}.ts::-webkit-scrollbar-track{background:#eee;border-radius:4px;}.ts::-webkit-scrollbar-thumb{background:#aaa;border-radius:4px;}.ts::-webkit-scrollbar-thumb:hover{background:#888;}.ts-top{overflow-x:auto;overflow-y:hidden;height:14px;}.ts-top::-webkit-scrollbar{height:8px;}.ts-top::-webkit-scrollbar-track{background:#eee;border-radius:4px;}.ts-top::-webkit-scrollbar-thumb{background:#aaa;border-radius:4px;}.ts-top::-webkit-scrollbar-thumb:hover{background:#888;}
thead th{position:sticky;top:0;z-index:3;}
table.wt thead th:nth-child(-n+2){z-index:4;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--g);color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.5px;white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid var(--b);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.r1 td,tr.r2 td,tr.r3 td,tr.r20 td{background:#fde8e8;}
tr.r40 td{background:#fff8f0;}
.b1,.b2,.b3{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;color:#fff;}
.b1{background:#c9a84c;}.b2{background:#a0a0a0;}.b3{background:#b87333;}
td.rk{text-align:center;font-weight:600;}
tr.hd{display:none;}
mark{background:#fff176;border-radius:2px;padding:0 1px;}
th.sk{cursor:pointer;user-select:none;}
th.sk:hover{background:var(--gm);}
.sa{opacity:.55;font-size:9px;margin-left:3px;}
table.wt{width:auto;min-width:100%;}
table.wt th:nth-child(1),table.wt td:nth-child(1){position:sticky;left:0;z-index:1;min-width:46px;}
table.wt th:nth-child(2),table.wt td:nth-child(2){position:sticky;left:46px;z-index:1;min-width:130px;box-shadow:2px 0 4px rgba(0,0,0,.07);}
table.wt th:nth-child(-n+2){background:var(--g);z-index:2;}
table.wt td:nth-child(-n+2){background:#f7faf8;}

var EQA={a:"a\u00e0\u00e1\u00e2\u00e3\u00e4\u00e5",c:"c\u00e7",e:"e\u00e8\u00e9\u00ea\u00eb",i:"i\u00ec\u00ed\u00ee\u00ef",n:"n\u00f1",o:"o\u00f2\u00f3\u00f4\u00f5\u00f6",u:"u\u00f9\u00fa\u00fb\u00fc",y:"y\u00fd\u00ff"};
function rxa(q){return String(q).split("").map(function(c){var b=nr(c),s=EQA[b];return s?"["+s+"]":c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("");}
function ds(q){
  var ql=nr(q),cb=document.getElementById("cb"),mc=document.getElementById("mc");
  cb.classList.toggle("on",q.length>0);
  if(!ql){mc.textContent="";document.querySelectorAll(".sh.on tbody tr").forEach(function(r){r.classList.remove("hd");rm(r);});return;}
  var n=0;
  document.querySelectorAll(".sh.on tbody tr").forEach(function(row){
    if(nr(row.textContent).indexOf(ql)>=0){row.classList.remove("hd");hl(row,ql);n++;}
    else{row.classList.add("hd");rm(row);}
  });
  mc.textContent=n+(n===1?" r\u00e9sultat":" r\u00e9sultats");
}
function cs(){
  var i=document.getElementById("sq");i.value="";
  document.getElementById("cb").classList.remove("on");
  document.getElementById("mc").textContent="";
  document.querySelectorAll("tbody tr").forEach(function(r){r.classList.remove("hd");rm(r);});
}
function hl(r,q){
  r.querySelectorAll("td").forEach(function(td){
    var o=td.getAttribute("data-o")||td.textContent;
    td.setAttribute("data-o",o);
    var re=new RegExp("("+rxa(q)+")","gi");
    td.innerHTML=o.replace(re,"<mark>$1<\/mark>");
  });
}
function rm(r){
  r.querySelectorAll("td").forEach(function(td){
    var o=td.getAttribute("data-o");
    if(o){td.textContent=o;td.removeAttribute("data-o");}
  });
}
function addTopScrollbars(){
  document.querySelectorAll(".ts").forEach(function(ts){
    var tbl=ts.querySelector("table.wt");
    if(!tbl)return;
    var top=document.createElement("div");
    top.className="ts-top";
    top.innerHTML="<div style='height:1px'></div>";
    ts.parentNode.insertBefore(top,ts);
    top.firstChild.style.width=tbl.offsetWidth+"px";
    top.addEventListener("scroll",function(){ts.scrollLeft=top.scrollLeft;});
    ts.addEventListener("scroll",function(){top.scrollLeft=ts.scrollLeft;});
  });
}
// Valeur numerique d'une cellule, figee a la generation dans data-v.
// Le texte affiche ne peut pas servir : "60 flamme +5" donnerait 605,
// et un score SergeLive avec bonus donnerait un nombre a 11 chiffres.
function vnum(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  var s=String(v==null?"":v);
  var m=s.match(/<strong>\s*(-?\d+(?:[.,]\d+)?)\s*<\/strong>/);
  if(m) return m[1].replace(",",".");
  s=s.trim();
  return /^-?\d+(?:[.,]\d+)?$/.test(s)?s.replace(",","."):null;
}
function cnum(td){
  if(!td) return undefined;
  var d=td.getAttribute("data-v");
  if(d===null||d==="") return undefined;
  var n=parseFloat(d);
  return isNaN(n)?undefined:n;
}
function cvide(td){
  var t=td?(td.textContent||"").trim():"";
  return t===""||t==="-"||t==="\u2013"||t==="\u2014";
}
function initSort(){
  document.querySelectorAll(".sh table").forEach(function(tbl){
    tbl.querySelectorAll("thead th").forEach(function(th,ci){
      if(/joker|attendus/i.test(th.textContent)) return;
      th.classList.add("sk");
      var sp=document.createElement("span");
      sp.className="sa";sp.textContent="\u21c5";
      th.appendChild(sp);
      th.addEventListener("click",function(){
        var asc=th.dataset.sort!=="asc";
        tbl.querySelectorAll("thead th").forEach(function(h){
          h.dataset.sort="";
          var s=h.querySelector(".sa");
          if(s){s.textContent="\u21c5";s.style.opacity=".55";}
        });
        th.dataset.sort=asc?"asc":"desc";
        sp.textContent=asc?"\u2191":"\u2193";
        sp.style.opacity="1";
        var tbody=tbl.querySelector("tbody");
        var rows=Array.from(tbody.querySelectorAll("tr"));
        // Colonne numerique = aucune cellule non vide sans data-v.
        // Un seul pseudo comme "205" la fait basculer en tri texte.
        var nNum=0,nTxt=0;
        rows.forEach(function(r){
          var td=r.cells[ci];
          if(cnum(td)!==undefined) nNum++;
          else if(!cvide(td)) nTxt++;
        });
        var num=nNum>0&&nTxt===0;
        rows.sort(function(a,b){
          var ta=a.cells[ci],tb=b.cells[ci];
          if(num){
            var na=cnum(ta),nb=cnum(tb);
            // Les cellules vides restent en fin dans les deux sens.
            if(na===undefined) return nb===undefined?0:1;
            if(nb===undefined) return -1;
            return asc?na-nb:nb-na;
          }
          var av=(ta?ta.textContent:"").trim(),bv=(tb?tb.textContent:"").trim();
          return asc?av.localeCompare(bv,"fr"):bv.localeCompare(av,"fr");
        });
        rows.forEach(function(r){tbody.appendChild(r);});
      });
    });
  });
}
</script>
